<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2a2210" />
      <stop offset="60%" stop-color="#141108" />
      <stop offset="100%" stop-color="#0a0904" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.5" />

  <!-- Film reel / cinema roll graphic -->
  <g filter="url(#glow)">
    <!-- Main Reel Body -->
    <circle cx="256" cy="240" r="130" fill="none" stroke="url(#gold)" stroke-width="20" />
    <circle cx="256" cy="240" r="50" fill="url(#gold)" />
    <circle cx="256" cy="240" r="24" fill="#0a0904" />

    <!-- Reel holes -->
    <circle cx="256" cy="155" r="22" fill="#0a0904" stroke="url(#gold)" stroke-width="6" />
    <circle cx="256" cy="325" r="22" fill="#0a0904" stroke="url(#gold)" stroke-width="6" />
    <circle cx="171" cy="240" r="22" fill="#0a0904" stroke="url(#gold)" stroke-width="6" />
    <circle cx="341" cy="240" r="22" fill="#0a0904" stroke="url(#gold)" stroke-width="6" />

    <circle cx="196" cy="180" r="18" fill="#0a0904" stroke="url(#gold)" stroke-width="5" />
    <circle cx="316" cy="180" r="18" fill="#0a0904" stroke="url(#gold)" stroke-width="5" />
    <circle cx="196" cy="300" r="18" fill="#0a0904" stroke="url(#gold)" stroke-width="5" />
    <circle cx="316" cy="300" r="18" fill="#0a0904" stroke="url(#gold)" stroke-width="5" />

    <!-- Film strip tape curling out -->
    <path d="M 370 200 C 420 220, 440 320, 380 390 C 340 430, 240 440, 150 410" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" stroke-dasharray="16,10" />
  </g>

  <!-- Typography / Brand line -->
  <text x="256" y="445" font-family="'Orbitron', sans-serif" font-weight="900" font-size="30" fill="url(#goldLight)" text-anchor="middle" letter-spacing="4">CINEMATIC SCROLL</text>
</svg>
